<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15161b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">

<title>Forgelifting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15161b; --panel:#1d1f26; --steel:#2e313a; --chalk:#ece8e0;
    --chalk-dust:#8d8f9a; --plate-blue:#5089b0; --plate-yellow:#c9a13f; --plate-red:#b3483f; --gold:#d4af37;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); color:var(--chalk); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  
  /* Auth Screen */
  #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
  .auth-box { background: var(--panel); border: 1px solid var(--steel); border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; }
  .auth-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 15px; object-fit:cover; }
  .auth-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--chalk); margin: 0 0 20px; letter-spacing: 0.05em; }
  .auth-box input { width: 100%; margin-bottom: 15px; padding: 12px; background: var(--ink); border: 1px solid var(--steel); color: var(--chalk); border-radius: 6px; }
  .btn-auth { width: 100%; background: var(--gold); color: var(--ink); border: none; padding: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-bottom: 10px; font-size: 15px; }
  .btn-auth-sec { width: 100%; background: transparent; color: var(--chalk-dust); border: 1px solid var(--steel); padding: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 15px; }
  .auth-error { color: var(--plate-red); font-size: 13px; margin-bottom: 15px; display: none; word-break: break-word; }

  /* App Layout */
  #app-screen { display: none; max-width:1180px; margin:0 auto; padding:28px 20px 50px; }
  
  .brand-container { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
  .brand-eyebrow { display: block; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 2px; }
  .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: .03em; margin: 0; line-height: 1; text-transform: uppercase; }
  
  .header-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;}
  
  .main-nav { display: flex; gap: 10px; margin-bottom: 24px; border-bottom: 1px solid var(--steel); padding-bottom: 10px; }
  .main-nav-btn { background: transparent; border: none; color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .05em; padding: 0; border-bottom: 2px solid var(--gold); }

  input,textarea,select{ background:var(--ink);border:1px solid var(--steel);color:var(--chalk); border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13.5px;width:100%; }
  input[readonly], textarea[readonly] { opacity: 0.75; cursor: not-allowed; border-color: transparent; }
  textarea{resize:vertical;}
  .mono-input{font-family:'JetBrains Mono',monospace;}
  .btn-logout { background: transparent; border: 1px solid var(--plate-red); color: var(--plate-red); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  /* Coach Panel */
  .coach-panel { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; display: none; align-items: center; gap: 15px; flex-wrap: wrap; }
  .coach-panel select { max-width: 250px; border-color: var(--gold); }

  /* Lifts & Weeks */
  .week-tabs{display:flex;gap:10px;overflow-x:auto;padding:10px 0;margin-bottom:10px;}
  .week-tab{background:transparent;border:none;cursor:pointer;padding:2px;flex:0 0 auto; opacity:0.6;}
  .week-tab.active{opacity:1;}
  .week-tab-ring{ width:44px;height:44px;border-radius:50%; background:var(--steel); display:flex;align-items:center;justify-content:center; }
  .week-tab.active .week-tab-ring{ background: var(--gold); }
  .week-tab-num{ width:36px;height:36px;border-radius:50%;background:var(--panel); display:flex;align-items:center;justify-content:center; font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--chalk); }
  
  .lifts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-bottom:18px;}
  .lift-card{ --lift-color:var(--steel); background:var(--panel);border:1px solid var(--steel);border-top:3px solid var(--lift-color); border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px; }
  .lift-card.lift-blue{--lift-color:var(--plate-blue);}
  .lift-card.lift-yellow{--lift-color:var(--plate-yellow);}
  .lift-card.lift-red{--lift-color:var(--plate-red);}
  .lift-card-header{display:flex;align-items:center;gap:10px;}
  .lift-icon svg{width:28px;height:28px;color:var(--lift-color);display:block;}
  .lift-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--lift-color);margin:0;}

  .field-group{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--chalk-dust);font-weight:600;margin-bottom:4px;}
  
  .feedback-card{background:var(--panel);border:1px solid var(--steel);border-radius:10px;padding:20px;margin-top:15px;}
  .rating-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .plate-rating{display:flex;gap:8px;}
  .plate-btn{width:26px;height:26px;border-radius:50%;border:2px solid var(--steel);background:transparent;cursor:pointer;padding:0;}
  .plate-btn.filled{background:var(--gold);border-color:var(--gold);}
  
  .save-indicator{font-size:12px;color:var(--gold);font-weight:600;}
</style>
</head>
<body>

<!-- PANTALLA AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <img src="logo.png" alt="Logo" class="auth-logo" onerror="this.style.display='none'">
    <h1>Forgelifting</h1>
    <div id="authError" class="auth-error"></div>
    <input type="email" id="emailInput" placeholder="Correo electrónico" required>
    <input type="password" id="passwordInput" placeholder="Contraseña" required>
    <button id="btnLogin" class="btn-auth">Iniciar Sesión</button>
    <button id="btnRegister" class="btn-auth-sec">Registrarme como Atleta</button>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app-screen">
  
  <header class="header-top">
    <div class="brand-container">
      <img src="logo.png" alt="Forgelifting Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand">
        <span class="brand-eyebrow">Powerlifting</span>
        <h1>Forgelifting</h1>
      </div>
    </div>
    <div class="header-controls">
      <span id="userEmailDisplay" style="font-size: 13px; color: var(--chalk-dust);"></span>
      <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <!-- PANEL ENTRENADOR -->
  <div id="coachPanel" class="coach-panel">
    <strong style="color: var(--gold); font-size: 14px;">PANEL ENTRENADOR</strong>
    <select id="athleteSelect">
      <option value="">Cargando atletas...</option>
    </select>
    <span id="saveIndicator" class="save-indicator"></span>
  </div>

  <nav class="main-nav">
    <span class="main-nav-btn">Planificación semanal</span>
  </nav>

  <nav class="week-tabs" id="weekTabs"></nav>
  <main id="weekContent" style="margin-top: 10px;"></main>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // ==========================================
  // CONFIGURACIÓN (REEMPLAZA CON TUS DATOS REALES)
  // ==========================================
  const ADMIN_EMAIL = "alejandr92009@hotmail.com"; 
  
  const firebaseConfig = {
  apiKey: "AIzaSyAaod77oOcmeZKAJ0lvR1s5PDq23ob6CFI",
  authDomain: "forgelifting-636d9.firebaseapp.com",
  databaseURL: "https://forgelifting-636d9-default-rtdb.firebaseio.com",
  projectId: "forgelifting-636d9",
  storageBucket: "forgelifting-636d9.firebasestorage.app",
  messagingSenderId: "476741821266",
  appId: "1:476741821266:web:f90ce2ecb43f833b1fd08b"
};
  // ==========================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let isCoach = false;
  let currentViewedAthleteId = null;
  let routineState = {}; 
  let currentWeek = 1;
  let saveTimeout = null;

  const authScreen = document.getElementById('auth-screen');
  const appScreen = document.getElementById('app-screen');
  const authError = document.getElementById('authError');
  const coachPanel = document.getElementById('coachPanel');
  const athleteSelect = document.getElementById('athleteSelect');
  const weekContent = document.getElementById('weekContent');
  const saveIndicator = document.getElementById('saveIndicator');

  const ICON_SQUAT = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="8" x2="10" y2="40" stroke="currentColor" stroke-width="3"/><line x1="38" y1="8" x2="38" y2="40" stroke="currentColor" stroke-width="3"/><line x1="3" y1="17" x2="45" y2="17" stroke="currentColor" stroke-width="4"/><circle cx="7" cy="17" r="5" fill="currentColor"/><circle cx="41" cy="17" r="5" fill="currentColor"/></svg>`;
  const ICON_BENCH = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="13" y="29" width="22" height="6" rx="1.5" fill="currentColor"/><line x1="15" y1="35" x2="15" y2="41" stroke="currentColor" stroke-width="3"/><line x1="33" y1="35" x2="33" y2="41" stroke="currentColor" stroke-width="3"/><line x1="3" y1="15" x2="45" y2="15" stroke="currentColor" stroke-width="4"/><circle cx="7" cy="15" r="5" fill="currentColor"/><circle cx="41" cy="15" r="5" fill="currentColor"/></svg>`;
  const ICON_DEADLIFT = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="3" y1="24" x2="45" y2="24" stroke="currentColor" stroke-width="4"/><circle cx="7" cy="24" r="6.5" fill="currentColor"/><circle cx="41" cy="24" r="6.5" fill="currentColor"/></svg>`;

  const LIFTS = [
    { key:'sentadilla', label:'Sentadilla', color:'blue', icon:ICON_SQUAT },
    { key:'pressBanca', label:'Press Banca', color:'yellow', icon:ICON_BENCH },
    { key:'pesoMuerto', label:'Peso Muerto', color:'red', icon:ICON_DEADLIFT }
  ];

  function emptyLift(){ return { series:'', reps:'', carga:'', sugerencia:'' }; }
  function emptyWeek(){ return { sentadilla:emptyLift(), pressBanca:emptyLift(), pesoMuerto:emptyLift(), feedback:{ valoracion:0, comentario:'' } }; }
  function generateEmptyRoutine(){ 
    const rut = {}; 
    for(let w=1; w<=8; w++) rut[w] = emptyWeek(); 
    return rut; 
  }

  // --- Auth Events ---
  document.getElementById('btnLogin').addEventListener('click', async () => {
    authError.style.display='none';
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passwordInput').value.trim();
    if(!email || !pass) { authError.innerText = "Ingresa correo y contraseña."; authError.style.display='block'; return; }
    try { 
      await signInWithEmailAndPassword(auth, email, pass); 
    } catch(err) { 
      authError.innerText = "Error: Credenciales incorrectas."; 
      authError.style.display='block'; 
    }
  });

  document.getElementById('btnRegister').addEventListener('click', async () => {
    authError.style.display='none';
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passwordInput').value.trim();
    if(!email || !pass) { authError.innerText = "Ingresa correo y contraseña."; authError.style.display='block'; return; }

    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "users", userCred.user.uid), { email: email, role: "athlete" });
    } catch(err) { 
      authError.innerText = "Error al crear cuenta: " + err.message; 
      authError.style.display='block'; 
    }
  });

  document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

  // --- Monitor de Sesión ---
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('userEmailDisplay').innerText = user.email;
      isCoach = (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
      
      authScreen.style.display = 'none';
      appScreen.style.display = 'block'; // Mostrar la app

      if (isCoach) {
        coachPanel.style.display = 'flex';
        await loadAthletesList();
        weekContent.innerHTML = '<p style="text-align:center; color: var(--chalk-dust); padding:40px 0;">Selecciona un atleta arriba para ver o asignar su rutina.</p>';
      } else {
        coachPanel.style.display = 'none';
        currentViewedAthleteId = user.uid;
        await fetchRoutine(user.uid);
      }
    } else {
      currentUser = null;
      authScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });

  async function loadAthletesList() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      athleteSelect.innerHTML = '<option value="">Selecciona un atleta...</option>';
      querySnapshot.forEach((doc) => {
        if(doc.data().role === 'athlete') {
          const opt = document.createElement('option');
          opt.value = doc.id; opt.innerText = doc.data().email;
          athleteSelect.appendChild(opt);
        }
      });
    } catch(e) {
      console.error("Error obteniendo atletas:", e);
    }
  }

  athleteSelect.addEventListener('change', async (e) => {
    currentViewedAthleteId = e.target.value;
    if(currentViewedAthleteId) await fetchRoutine(currentViewedAthleteId);
    else weekContent.innerHTML = '<p style="text-align:center; color: var(--chalk-dust); padding:40px 0;">Selecciona un atleta arriba.</p>';
  });

  async function fetchRoutine(uid) {
    weekContent.innerHTML = '<p style="text-align:center; color: var(--chalk-dust); padding:40px 0;">Cargando datos desde la nube...</p>';
    try {
      const docRef = doc(db, "routines", uid);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        routineState = docSnap.data();
      } else {
        routineState = generateEmptyRoutine();
        if(isCoach) await setDoc(docRef, routineState);
      }
      renderTabs();
      renderWeek(currentWeek);
    } catch(e) {
      weekContent.innerHTML = `<p style="color:var(--plate-red); text-align:center;">Error de conexión con la base de datos.</p>`;
    }
  }

  async function triggerSave() {
    if(!currentViewedAthleteId) return;
    saveIndicator.innerText = "Guardando...";
    clearTimeout(saveTimeout);
    
    saveTimeout = setTimeout(async () => {
      try {
        await setDoc(doc(db, "routines", currentViewedAthleteId), routineState);
        saveIndicator.innerText = "¡Guardado! ✓";
        setTimeout(() => { saveIndicator.innerText = ""; }, 2500);
      } catch(e) { saveIndicator.innerText = "Error al guardar"; }
    }, 1000);
  }

  function renderTabs() {
    let html='';
    for(let w=1; w<=8; w++){
      html+=`<button type="button" class="week-tab ${w===currentWeek?'active':''}" data-week="${w}">
        <span class="week-tab-ring"><span class="week-tab-num">${w}</span></span>
      </button>`;
    }
    document.getElementById('weekTabs').innerHTML = html;
  }

  document.getElementById('weekTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.week-tab');
    if(!btn) return;
    currentWeek = parseInt(btn.dataset.week, 10);
    renderTabs();
    renderWeek(currentWeek);
  });

  function renderWeek(w) {
    if(!routineState[w]) routineState[w] = emptyWeek();
    
    // Si es Coach puede editar los ejercicios, si es atleta solo lee
    const roAttr = isCoach ? '' : 'readonly';

    const liftsHTML = LIFTS.map(lift => {
      const data = routineState[w][lift.key] || emptyLift();
      return `
      <section class="lift-card lift-${lift.color}">
        <div class="lift-card-header"><span class="lift-icon">${lift.icon}</span><h2 class="lift-title">${lift.label}</h2></div>
        <div class="field-group">
          <div class="field"><label>Series</label><input type="text" class="mono-input" value="${data.series||''}" data-lift="${lift.key}" data-field="series" ${roAttr}></div>
          <div class="field"><label>Reps</label><input type="text" class="mono-input" value="${data.reps||''}" data-lift="${lift.key}" data-field="reps" ${roAttr}></div>
          <div class="field"><label>Carga</label><input type="text" class="mono-input" value="${data.carga||''}" data-lift="${lift.key}" data-field="carga" ${roAttr}></div>
        </div>
        <div class="field"><label>Notas del Entrenador</label><textarea rows="2" data-lift="${lift.key}" data-field="sugerencia" ${roAttr}>${data.sugerencia||''}</textarea></div>
      </section>`;
    }).join('');

    const fb = routineState[w].feedback || { valoracion:0, comentario:'' };
    let plates='';
    for(let i=1;i<=5;i++){ plates+=`<button type="button" class="plate-btn ${i<=fb.valoracion?'filled':''}" data-val="${i}"></button>`; }
    
    const fbHTML = `
    <section class="feedback-card">
      <h2 style="color:var(--chalk); font-family:'Bebas Neue',sans-serif; font-size:22px; margin-top:0;">Feedback del Atleta (Semana ${w})</h2>
      <div class="rating-row"><span style="font-size:12px; color:var(--chalk-dust); text-transform:uppercase;">Sensación</span><div class="plate-rating">${plates}</div></div>
      <div class="field"><textarea rows="2" placeholder="Notas de fatiga, RPE, dolores..." id="fbComment">${fb.comentario||''}</textarea></div>
    </section>`;

    weekContent.innerHTML = `<div class="lifts-grid">${liftsHTML}</div>${fbHTML}`;
  }

  weekContent.addEventListener('input', (e) => {
    const t = e.target;
    if(t.dataset.lift && !t.hasAttribute('readonly')) {
      if(!routineState[currentWeek][t.dataset.lift]) routineState[currentWeek][t.dataset.lift] = emptyLift();
      routineState[currentWeek][t.dataset.lift][t.dataset.field] = t.value;
      triggerSave();
    }
    if(t.id === 'fbComment') {
      if(!routineState[currentWeek].feedback) routineState[currentWeek].feedback = { valoracion:0, comentario:'' };
      routineState[currentWeek].feedback.comentario = t.value;
      triggerSave();
    }
  });

  weekContent.addEventListener('click', (e) => {
    const btn = e.target.closest('.plate-btn');
    if(!btn) return;
    const val = parseInt(btn.dataset.val, 10);
    if(!routineState[currentWeek].feedback) routineState[currentWeek].feedback = { valoracion:0, comentario:'' };
    routineState[currentWeek].feedback.valoracion = val;
    renderWeek(currentWeek);
    triggerSave();
  // Registrar Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    });
  }
  });
</script>
</body>
</html>
